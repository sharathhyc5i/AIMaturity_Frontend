name: Deploy frontend

# Every push to main builds the React app (frontend/) and deploys it to Azure App Service (RetailerAIMaturity).
# The site calls the API set in frontend/.env.production (VITE_API_URL) at build time.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the site
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package the site
        run: |
          mkdir -p package
          cp server.js package.json package/
          cp -r frontend/dist package/dist
          (cd package && zip -rq "$RUNNER_TEMP/frontend.zip" .)

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group AI-Maturity \
            --name RetailerAIMaturity \
            --src-path "$RUNNER_TEMP/frontend.zip" \
            --type zip \
            --timeout 1200000
