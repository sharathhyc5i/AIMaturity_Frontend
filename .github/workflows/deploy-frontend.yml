name: Deploy frontend

# Every push to main builds the React app (frontend/) and deploys it to Azure App Service (RetailerAIMaturity).
# The site calls the API set in frontend/.env.production (VITE_API_URL) at build time.
# Uses the app's publish profile, stored as the repo secret AZURE_WEBAPP_PUBLISH_PROFILE.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the site
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package the site
        run: |
          mkdir -p package
          cp server.js package.json package/
          cp -r frontend/dist package/dist
          (cd package && zip -rq "$RUNNER_TEMP/frontend.zip" .)

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: RetailerAIMaturity
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/frontend.zip
